name: Generation regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --configuration phpunit.xml.dist
      - run: php tests/regression/image-input.php
      - run: php tests/regression/first-value.php
